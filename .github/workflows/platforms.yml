# platforms: every module's tests plus `agentinfo -fixtures` on Linux, macOS
# and Windows runners. This is where the Windows code paths (PATHEXT, .cmd
# shims, the PowerShell process table, case-insensitive env) run on a real
# Windows; locally `task check` only compiles them for Windows.
#
# Manual only (workflow_dispatch), on purpose: the maintainer decides
# whether it also runs on push or pull request. Start it from the Actions
# tab.
name: platforms
on:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x" }
      - name: workspace
        # go.work with version-specific replaces: the runner cannot fetch the
        # private sibling modules at their pinned pseudo-versions.
        run: bash scripts/workspace.sh
      - name: test every module
        # Every module runs even after a failure; the step fails at the end
        # with the list, so one failing module never hides the others.
        run: |
          failed=""
          for m in . claude codex codex/state gemini pi opencode opencode/store builtin examples; do
            echo "::group::$m"
            if ! (cd "$m" && go test -count=1 ./...); then failed="$failed $m"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED modules:$failed"; exit 1; fi
      - name: agentinfo -fixtures
        working-directory: examples
        run: go run ./agentinfo -fixtures
